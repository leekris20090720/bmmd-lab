name: Publish BMMD website

on:
  push:
    branches: [main]
    paths:
      - site.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website package
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unpack the published website
        run: |
          unzip -t site.zip
          mkdir -p _site
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/engineering-effects.js
          test -f _site/assets/ui/three-runtime.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
